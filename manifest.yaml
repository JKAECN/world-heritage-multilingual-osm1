- step: 5
  script: validation_audit.py
  outputs:
  - validation_audit_worksheet.csv
  - audit_summary.json
notes: Raw Overpass extracts are excluded from hashing (size ~535 MB, ODbL share-alike;
  re-downloadable via the archived queries on the recorded snapshot date).
